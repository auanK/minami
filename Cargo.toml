[package]
name = "minami"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only structural inspection of EPUB 2 books"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
